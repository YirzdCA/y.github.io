<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时间差计算器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* MIUI 风格卡片 - 毛玻璃效果 */
        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 32px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 600;
            color: #1a1a1a;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 13px;
            color: #888;
            margin-top: 6px;
        }

        /* 时间输入组 */
        .time-group {
            margin-bottom: 20px;
        }

        .time-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #555;
            margin-bottom: 10px;
            padding-left: 4px;
        }

        .time-label .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .dot-start {
            background: #34C759;
        }

        .dot-end {
            background: #FF3B30;
        }

        /* MIUI 风格输入框 */
        .time-input-wrapper {
            position: relative;
        }

        .time-input {
            width: 100%;
            padding: 14px 18px;
            font-size: 16px;
            border: 2px solid #e5e5e5;
            border-radius: 16px;
            background: #fff;
            color: #333;
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
            cursor: pointer;
        }

        .time-input:hover {
            border-color: #c0c0c0;
        }

        .time-input:focus {
            border-color: #3482FF;
            box-shadow: 0 0 0 4px rgba(52, 130, 255, 0.1);
        }

        /* 快捷操作 */
        .quick-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .quick-btn {
            padding: 6px 14px;
            border: none;
            border-radius: 20px;
            background: #f0f0f0;
            color: #555;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .quick-btn:hover {
            background: #e0e0e0;
        }

        .quick-btn:active {
            transform: scale(0.95);
        }

        /* MIUI 风格按钮 */
        .calculate-btn {
            width: 100%;
            padding: 16px;
            margin-top: 24px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #3482FF 0%, #1a6fd6 100%);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(52, 130, 255, 0.3);
            font-family: inherit;
        }

        .calculate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(52, 130, 255, 0.4);
        }

        .calculate-btn:active {
            transform: translateY(0);
        }

        /* 结果区域 */
        .result {
            margin-top: 24px;
            padding: 20px;
            border-radius: 16px;
            background: linear-gradient(135deg, #f8f9ff 0%, #f0f4ff 100%);
            border: 1px solid #e0e8ff;
            text-align: center;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease;
        }

        .result.show {
            opacity: 1;
            transform: translateY(0);
        }

        .result-label {
            font-size: 13px;
            color: #888;
            margin-bottom: 8px;
        }

        .result-value {
            font-size: 42px;
            font-weight: 700;
            color: #3482FF;
            line-height: 1;
        }

        .result-unit {
            font-size: 14px;
            color: #666;
            margin-top: 6px;
        }

        .result-detail {
            font-size: 12px;
            color: #999;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #d0d8e8;
        }

        /* 交换按钮 */
        .swap-btn {
            display: flex;
            justify-content: center;
            margin: 8px 0;
        }

        .swap-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #f5f5f5;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            color: #888;
        }

        .swap-icon:hover {
            background: #e8e8e8;
            transform: rotate(180deg);
        }

        /* 动画 */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .calculating {
            animation: pulse 1s infinite;
        }

        /* 响应式 */
        @media (max-width: 480px) {
            .container {
                padding: 24px;
                border-radius: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⏱️ 时间差计算器</h1>
            <p>计算两个时间点之间的分钟差</p>
        </div>

        <!-- 开始时间 -->
        <div class="time-group">
            <div class="time-label">
                <span class="dot dot-start"></span>
                开始时间
            </div>
            <div class="time-input-wrapper">
                <input type="datetime-local" class="time-input" id="startTime">
            </div>
            <div class="quick-actions">
                <button class="quick-btn" onclick="setNow('startTime')">设为现在</button>
                <button class="quick-btn" onclick="adjustTime('startTime', -30)">-30分钟</button>
                <button class="quick-btn" onclick="adjustTime('startTime', -60)">-1小时</button>
            </div>
        </div>

        <!-- 交换按钮 -->
        <div class="swap-btn">
            <button class="swap-icon" onclick="swapTimes()" title="交换时间">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M7 16V4M7 4L3 8M7 4l4 4M17 8v12m0 0l4-4m-4 4l-4-4"/>
                </svg>
            </button>
        </div>

        <!-- 结束时间 -->
        <div class="time-group">
            <div class="time-label">
                <span class="dot dot-end"></span>
                结束时间
            </div>
            <div class="time-input-wrapper">
                <input type="datetime-local" class="time-input" id="endTime">
            </div>
            <div class="quick-actions">
                <button class="quick-btn" onclick="setNow('endTime')">设为现在</button>
                <button class="quick-btn" onclick="adjustTime('endTime', 30)">+30分钟</button>
                <button class="quick-btn" onclick="adjustTime('endTime', 60)">+1小时</button>
            </div>
        </div>

        <!-- 计算按钮 -->
        <button class="calculate-btn" onclick="calculate()">
            计算时间差
        </button>

        <!-- 结果 -->
        <div class="result" id="result">
            <div class="result-label">时间差</div>
            <div class="result-value" id="resultValue">0</div>
            <div class="result-unit">分钟</div>
            <div class="result-detail" id="resultDetail"></div>
        </div>
    </div>

    <script>
        // 页面加载时自动设置为当前时间
        window.onload = function() {
            setNow('startTime');
            setNow('endTime');
            // 结束时间默认加30分钟，方便计算
            adjustTime('endTime', 30);
        };

        // 设置为当前时间
        function setNow(inputId) {
            const now = new Date();
            // 转换为本地时间格式 (YYYY-MM-DDTHH:MM)
            const localISO = new Date(now.getTime() - now.getTimezoneOffset() * 60000)
                .toISOString()
                .slice(0, 16);
            document.getElementById(inputId).value = localISO;
        }

        // 调整时间（分钟）
        function adjustTime(inputId, minutes) {
            const input = document.getElementById(inputId);
            let date = input.value ? new Date(input.value) : new Date();
            date.setMinutes(date.getMinutes() + minutes);
            const localISO = new Date(date.getTime() - date.getTimezoneOffset() * 60000)
                .toISOString()
                .slice(0, 16);
            input.value = localISO;
        }

        // 交换时间
        function swapTimes() {
            const start = document.getElementById('startTime').value;
            const end = document.getElementById('endTime').value;
            document.getElementById('startTime').value = end;
            document.getElementById('endTime').value = start;
        }

        // 计算时间差
        function calculate() {
            const startVal = document.getElementById('startTime').value;
            const endVal = document.getElementById('endTime').value;

            if (!startVal || !endVal) {
                alert('请选择完整的时间');
                return;
            }

            const start = new Date(startVal);
            const end = new Date(endVal);
            const diffMs = end - start;
            const diffMinutes = Math.round(diffMs / 60000);

            // 显示结果
            const resultEl = document.getElementById('result');
            const resultValueEl = document.getElementById('resultValue');
            const resultDetailEl = document.getElementById('resultDetail');

            resultValueEl.textContent = Math.abs(diffMinutes).toLocaleString();
            
            // 详细说明
            const absMinutes = Math.abs(diffMinutes);
            const hours = Math.floor(absMinutes / 60);
            const mins = absMinutes % 60;
            let detail = '';
            
            if (diffMinutes > 0) {
                detail = `结束时间比开始时间晚`;
            } else if (diffMinutes < 0) {
                detail = `结束时间比开始时间早`;
            } else {
                detail = `两个时间相同`;
            }

            if (hours > 0) {
                detail += `，约 ${hours}小时${mins > 0 ? mins + '分钟' : ''}`;
            } else if (mins > 0) {
                detail += `，${mins}分钟`;
            }

            resultDetailEl.textContent = detail;

            // 动画显示
            resultEl.classList.remove('show');
            setTimeout(() => resultEl.classList.add('show'), 50);
        }

        // 回车键计算
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') calculate();
        });
    </script>
</body>
</html>
